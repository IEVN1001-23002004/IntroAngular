<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<div>
  <h4>Punto 1:</h4>
  <input type="number" [(ngModel)]="x1" placeholder="x1">
  <input type="number" [(ngModel)]="y1" placeholder="y1">

  <br><br>

  <h4>Punto 2:</h4>
  <input type="number" [(ngModel)]="x2" placeholder="x2">
  <input type="number" [(ngModel)]="y2" placeholder="y2">

  <br><br>

  <button (click)="calcular()" type="button" class="btn btn-primary">
    Calcular Distancia
  </button>

  <h3>Resultado: {{ resultado }}</h3>
</div>
</body>
</html>
