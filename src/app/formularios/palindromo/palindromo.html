<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<div class="contenedor-palindromo">
  <h2>Detector de Palíndromos</h2>

  <div>
    <label for="frase">Ingresa una palabra o frase:</label>
    <input 
      id="frase"
      type="text" 
      [(ngModel)]="frase" 
      placeholder="Ej. Oso"
    />
    <button (click)="procesar()">Evaluar</button>
    <button (click)="limpiar()">Limpiar</button>
  </div>

  <div *ngIf="resultado">
    <h3>Resultado: {{ resultado }}</h3>
    
    <p>Total de vocales: {{ nVocales }}</p>
    <p>Vocales encontradas: {{ vocales.join(', ') }}</p>

    <p>Total de consonantes: {{ nConsonantes }}</p>
    <p>Consonantes encontradas: {{ consonantes.join(', ') }}</p>
  </div>
</div>
</body>
</html>
