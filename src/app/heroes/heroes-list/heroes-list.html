<p>heroes-list works!</p>
<div class="card">
    <div class="card-header">
        <div class="card-body">
            <div class="row">
                <div class="col-md-2">
                    filtrarpor:
                </div>
                <div class="col-md-4">
                    <input [(ngModel)]="listFilter" type="text" class="from-control" placeholder="Ingrese Nombre del Heroe">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <h3>filtro:{{listFilter}} </h3>
                </div>
            </div>
            <div class="table-responsive">
                <div class="table-responsive">
                    <table *ngIf="heroes.length > 0" class="table">
                        <thead>
                            <tr>
                                <th>
                                    <button (click)="showImage()" class="btn btn-primary">
                                        {{muestraImage?'oculta':'Muestra'}}Imagen
                                    </button>
                                </th>
                                <th>Nombre</th>
                                <th>Descripcion</th>
                                <th>Raza</th>
                                <th>Ki</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let heroe of heroes">
                                <td><img *ngIf="muestraImage" [src]="heroe.imagen"
                                    [style.width.px]="imageWidth"
                                    [style.margin.px]="imageMargin"
                                    ></td>
                                <td>{{heroe.nombre}}</td>
                                <td>{{heroe.descripcion}}</td>
                                <td>{{heroe.raza}}</td>
                                <td>{{heroe.ki}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
